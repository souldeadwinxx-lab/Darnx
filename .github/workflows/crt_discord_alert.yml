name: CRT Discord Alert

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  check-signal:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Show repository files
        run: |
          echo "GITHUB_WORKSPACE=$GITHUB_WORKSPACE"
          echo "Current directory:"
          pwd
          echo "Root files:"
          ls -la "$GITHUB_WORKSPACE"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r "$GITHUB_WORKSPACE/requirements.txt"

      - name: Restore alert-state cache
        uses: actions/cache@v4
        with:
          path: "$GITHUB_WORKSPACE/last_alert_state.json"
          key: crt-alert-state

      - name: Run signal check
        env:
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          INSTRUMENT: "XAU/USD"
          ACCOUNT_EQUITY: "10000"
          RISK_PERCENT: "0.5"
        run: |
          python "$GITHUB_WORKSPACE/crt_discord_alert.py" --once
